<!DOCTYPE html>
<html lang="en" data-page="home">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="My Portfolio's House — Doan Minh Khoa. Designer, Creator, Photographer." />
  <title>My Portfolio's House — Doan Minh Khoa</title>
 
  <!-- Google Fonts: Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Serif+JP:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
 
  <!-- Global stylesheet -->
  <link rel="stylesheet" href="style.css" />
 
  <!-- Home-page specific overrides -->
  <style>
    /* Full-screen scene; main.js's nav padding is removed for the home overlay */
    body { padding-top: 0 !important; overflow: hidden; }
 
    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #FAF6F0;
    }
    #three-canvas { display: block; width: 100%; height: 100%; }
 
    /* Overlay sits above the canvas */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding: clamp(1.5rem, 5vw, 3.5rem);
    }
    .overlay > * { pointer-events: auto; }
 
    .hero {
      grid-row: 2;
      text-align: center;
      max-width: 880px;
    }
    .hero .eyebrow { margin-bottom: 1rem; }
    .hero .title {
      font-family: var(--font-serif);
      font-size: clamp(2.75rem, 7vw, 5.75rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.01em;
      line-height: 1.05;
      margin: 0 0 1.25rem;
      text-shadow: 0 1px 0 rgba(250, 246, 240, 0.5);
    }
    .hero .subtitle {
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      letter-spacing: 0.32em;
      text-transform: lowercase;
      color: var(--color-text-soft);
      margin: 0;
    }
 
    /* "Click to enter" prompt — sits near the house door */
    .enter-prompt {
      position: fixed;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.45rem 0.7rem;
      color: var(--color-wood);
      font-family: var(--font-serif);
      font-size: 0.92rem;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      cursor: pointer;
    }
    .enter-prompt .enter-prompt__line {
      width: 28px; height: 1px;
      background: currentColor;
      opacity: 0.7;
    }
    .enter-prompt:hover { color: var(--color-text); }
 
    /* Pulse animation */
    .pulse { animation: pulseSoft 2.6s ease-in-out infinite; }
    @keyframes pulseSoft {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
 
    /* Mute button — fixed corner */
    .mute-button {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid rgba(139, 115, 85, 0.32);
      border-radius: 999px;
      background: rgba(250, 246, 240, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--color-text);
      font-family: var(--font-serif);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      cursor: pointer;
      transition: color var(--dur-fast) var(--ease-soft),
                  border-color var(--dur-fast) var(--ease-soft);
    }
    .mute-button:hover { color: var(--color-wood); border-color: var(--color-wood); }
    .mute-button .mute-icon--off { display: none; }
    .mute-button[aria-pressed="true"] .mute-icon--on  { display: none; }
    .mute-button[aria-pressed="true"] .mute-icon--off { display: inline-flex; }
 
    /* Static nav fallback — main.js will replace it with the animated SVG signature version */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem clamp(1.25rem, 3vw, 2.5rem);
      background: rgba(250, 246, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139, 115, 85, 0.12);
    }
    .site-nav__brand {
      display: inline-flex;
      align-items: baseline;
      gap: 0.6rem;
      color: var(--color-text);
    }
    .site-nav__brand .brand-mark {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--color-wood);
      letter-spacing: 0.02em;
    }
    .site-nav__brand .brand-jp {
      font-family: var(--font-jp);
      font-size: 0.85rem;
      letter-spacing: 0.32em;
      color: var(--color-text-soft);
    }
    .site-nav__menu {
      display: flex;
      list-style: none;
      gap: clamp(1rem, 2.4vw, 2rem);
      margin: 0; padding: 0;
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      text-transform: lowercase;
    }
    .site-nav__menu a {
      color: var(--color-text-soft);
      padding-block: 0.25rem;
    }
    .site-nav__menu a.is-active {
      color: var(--color-text);
      font-weight: 500;
    }
     @media (max-width: 768px) {
     .mute-button {
       top: auto;
       bottom: 1rem;
       right: 1rem;
      }
     }

    @media (max-width: 480px) {
      .mute-button .mute-label { display: none; }
      .mute-button { padding: 0.45rem 0.55rem; }
      .site-nav { padding: 0.75rem 1rem; }
      .site-nav__menu { gap: 1rem; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <!-- Page fade overlay (used by main.js for cross-page transitions) -->
  <div id="page-fade" class="page-fade"></div>
 
  <!-- Static nav (replaced by main.js with animated brush-signature version) -->
  <nav class="site-nav" aria-label="Primary">
    <a href="index.html" class="site-nav__brand">
      <span class="brand-mark">mk</span>
      <span class="brand-jp">&#32032;&#26420;&#21619;</span>
    </a>
    <ul class="site-nav__menu">
      <li><a href="index.html"   class="is-active">Home</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
 
  <!-- Three.js canvas -->
  <div id="scene-container">
    <canvas id="three-canvas" aria-hidden="true"></canvas>
  </div>
 
  <!-- Mute button (wired up by main.js's setupWindChime) -->
  <button
    id="mute-button"
    class="mute-button"
    type="button"
    aria-label="Toggle ambient wind chime"
    aria-pressed="false"
  >
    <span class="mute-icon mute-icon--on" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="mute-icon mute-icon--off" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l5 6M21 9l-5 6"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="mute-label">wind chime</span>
  </button>
 
  <!-- Hero overlay -->
  <div class="overlay">
    <main class="hero">
      <p class="eyebrow">&#39080; &ensp; welcome, traveler</p>
      <h1 class="title">My Portfolio's House</h1>
      <p class="subtitle">Designer &amp; Creator &amp; Photographer</p>
    </main>
  </div>
 
  <!-- "Click to enter" prompt near the house door -->
  <button
    id="enter-button"
    class="enter-prompt pulse"
    type="button"
    aria-label="Enter the house and view work"
  >
    <span class="enter-prompt__line"></span>
    <span class="enter-prompt__text">&mdash; Click to enter &mdash;</span>
    <span class="enter-prompt__line"></span>
  </button>
 
  <!-- Three.js (r128 global build) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
 
  <!-- Shared site behaviors (nav injection, page fade, lightbox, wind chime) -->
  <script src="main.js" defer></script>
</body>
</html>
